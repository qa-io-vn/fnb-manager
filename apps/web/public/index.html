<!doctype html>
<html lang="vi">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>FNB Manager — đang xây dựng</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #f6f4ef;
				color: #1f1d1a;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #17161a;
					color: #ece9e2;
				}
			}
			main {
				max-width: 32rem;
				padding: 2rem 1.5rem;
				text-align: center;
			}
			h1 {
				font-size: 1.6rem;
				margin-bottom: 0.5rem;
			}
			p {
				line-height: 1.5;
				opacity: 0.85;
			}
			.badge {
				display: inline-block;
				padding: 0.25rem 0.75rem;
				border-radius: 999px;
				background: #0a7a62;
				color: #fff;
				font-size: 0.85rem;
				letter-spacing: 0.02em;
			}
		</style>
	</head>
	<body>
		<main>
			<span class="badge">Đang xây dựng · giai đoạn 1–4</span>
			<h1>FNB Manager</h1>
			<p>Trang quản lý cho cửa hàng F&amp;B: báo cáo doanh thu, thực đơn, thanh toán, kế hoạch phát triển và chương trình thành viên trên Zalo.</p>
			<p>Bản thử nghiệm (POC) sẽ xuất hiện tại địa chỉ này khi giai đoạn 6 của lộ trình hoàn thành.</p>
		</main>
	</body>
</html>

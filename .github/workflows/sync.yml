name: Sync

on:
  schedule:
    - cron: "23 3 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:
    inputs:
      account_number:
        description: Position of the account in POS_ACCOUNTS_JSON, 1 for the first (empty runs every account)
        required: false
        type: string
      from:
        description: First business date, YYYY-MM-DD (empty means 13 days before the last date)
        required: false
        type: string
      to:
        description: Last business date, YYYY-MM-DD (empty means yesterday in Asia/Ho_Chi_Minh)
        required: false
        type: string
      kind:
        description: Run kind recorded in sync_runs
        required: true
        type: choice
        default: manual
        options:
          - manual
          - backfill
          - nightly
          - incremental
      dry_run:
        description: Pull and compare without writing
        required: false
        type: boolean
        default: false

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync POS sales into the database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Check configuration
        id: config
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          POS_ACCOUNTS_JSON: ${{ secrets.POS_ACCOUNTS_JSON }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$POS_ACCOUNTS_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Sync not configured yet (SUPABASE_DB_URL or POS_ACCOUNTS_JSON secret missing); nothing to sync." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.configured == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Mask credential fields
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          POS_ACCOUNTS_JSON: ${{ secrets.POS_ACCOUNTS_JSON }}
          IPOS_APP_KEY: ${{ secrets.IPOS_APP_KEY }}
          NOTIFY_ZALO_BOT_TOKEN: ${{ secrets.NOTIFY_ZALO_BOT_TOKEN }}
          NOTIFY_EMAIL_API_KEY: ${{ secrets.NOTIFY_EMAIL_API_KEY }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node apps/jobs/bin/fnb.mjs mask-credentials
      - name: Choose the window
        id: window
        if: steps.config.outputs.configured == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FROM: ${{ github.event.inputs.from }}
          INPUT_TO: ${{ github.event.inputs.to }}
          INPUT_KIND: ${{ github.event.inputs.kind }}
        run: |
          yesterday=$(date -d 'yesterday' +%F)
          if [ "$EVENT_NAME" = "schedule" ]; then
            to="$yesterday"
            kind="nightly"
          else
            to="${INPUT_TO:-$yesterday}"
            kind="${INPUT_KIND:-manual}"
          fi
          if ! [[ "$to" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::the last date must look like YYYY-MM-DD"
            exit 1
          fi
          from="${INPUT_FROM:-$(date -d "$to -13 days" +%F)}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            from=$(date -d "$to -13 days" +%F)
          fi
          if ! [[ "$from" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::the first date must look like YYYY-MM-DD"
            exit 1
          fi
          {
            echo "from=$from"
            echo "to=$to"
            echo "kind=$kind"
          } >> "$GITHUB_OUTPUT"
          echo "## Sync $kind, business dates $from to $to" >> "$GITHUB_STEP_SUMMARY"
      - name: Sync the window
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          POS_ACCOUNTS_JSON: ${{ secrets.POS_ACCOUNTS_JSON }}
          IPOS_APP_KEY: ${{ secrets.IPOS_APP_KEY }}
          ACCOUNT_NUMBER: ${{ github.event.inputs.account_number }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FROM: ${{ steps.window.outputs.from }}
          TO: ${{ steps.window.outputs.to }}
          KIND: ${{ steps.window.outputs.kind }}
        run: |
          args=(sync window --from "$FROM" --to "$TO" --kind "$KIND")
          if [ -n "$ACCOUNT_NUMBER" ]; then
            args+=(--account-number "$ACCOUNT_NUMBER")
          else
            args+=(--all-accounts)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          node apps/jobs/bin/fnb.mjs "${args[@]}"
      - name: Build due digests
        if: always() && steps.config.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node apps/jobs/bin/fnb.mjs digest --due
      - name: Send due messages
        if: always() && steps.config.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          NOTIFY_ZALO_BOT_TOKEN: ${{ secrets.NOTIFY_ZALO_BOT_TOKEN }}
          NOTIFY_EMAIL_API_KEY: ${{ secrets.NOTIFY_EMAIL_API_KEY }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_FROM_NAME: ${{ secrets.NOTIFY_EMAIL_FROM_NAME }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_WEBHOOK_SECRET: ${{ secrets.NOTIFY_WEBHOOK_SECRET }}
        run: node apps/jobs/bin/fnb.mjs notify tick
      - name: Status
        if: always() && steps.config.outputs.configured == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          POS_ACCOUNTS_JSON: ${{ secrets.POS_ACCOUNTS_JSON }}
        run: node apps/jobs/bin/fnb.mjs status
      - name: Note a failure in the summary
        if: failure() && steps.config.outputs.configured == 'true'
        run: echo "Sync failed; the log of the failing step has the counts and the credential-free error." >> "$GITHUB_STEP_SUMMARY"

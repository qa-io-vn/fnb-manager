name: Migrate database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations to the linked Supabase project
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes
      - name: Dry run
        if: github.event_name == 'pull_request'
        run: pnpm exec supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply
        if: github.event_name != 'pull_request'
        run: pnpm exec supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

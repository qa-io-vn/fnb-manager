name: Migrate database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Push migrations to the linked Supabase project
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check cloud configuration
        id: config
        env:
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloud project not configured yet (SUPABASE_PROJECT_ID secret missing); nothing to migrate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.configured == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.config.outputs.configured == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.configured == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.config.outputs.configured == 'true'
        run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --yes
      - name: Dry run
        if: steps.config.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: pnpm exec supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --dry-run
      - name: Apply
        if: steps.config.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: pnpm exec supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

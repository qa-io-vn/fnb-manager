name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and identifier scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/check-public-safe.mjs

  code:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: No workflow or job exposes a cloud secret beyond its steps
        run: |
          node scripts/check-workflow-secrets.mjs --self-test
          node scripts/check-workflow-secrets.mjs
      - name: The cron delay report attributes runs to their own slots
        run: node scripts/cron-delay-report.mjs --self-test
      - name: Every documentation link and anchor resolves, and docs/README.md lists every document
        run: |
          node scripts/check-doc-links.mjs --self-test
          node scripts/check-doc-links.mjs
      - name: Web build of the demo with the bundle and size checks
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
        run: pnpm --filter @fnb/web build
      - name: Check the Edge Function import map is current
        run: node scripts/function-imports.mjs --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.3
      - name: Type-check and test every Edge Function with Deno
        working-directory: supabase/functions
        run: |
          for directory in */; do
            name="${directory%/}"
            if [ "$name" = "_shared" ]; then
              continue
            fi
            echo "::group::$name"
            (cd "$name" && deno check index.ts && deno test --permit-no-files)
            echo "::endgroup::"
          done
      - name: Test the shared Edge Function helpers with Deno
        working-directory: supabase/functions/_shared
        run: deno test

  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - name: The API documentation matches the database functions
        run: pnpm docs:check-api
      - name: The OpenAPI description matches the database
        run: pnpm docs:check-openapi
      - name: Show how the OpenAPI description differs
        if: failure()
        run: |
          pnpm docs:openapi
          git diff --stat -- docs/api/openapi.json
          git diff -- docs/api/openapi.json | head -400
      - run: pnpm --filter @fnb/demo-analytics test:parity:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Sync and command-line integration suites on the fresh stack
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          pnpm --filter @fnb/sync exec vitest run test/integration
          pnpm --filter @fnb/jobs exec vitest run test/integration
      - if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: Web end-to-end tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    # G-59: one job took 29 minutes; the live specs (own local stack) and the demo and pages specs run as parallel shards.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: live 1 of 2
            id: live-1
            projects: --project=live
            shard: 1/2
            stack: true
          - part: live 2 of 2
            id: live-2
            projects: --project=live
            shard: 2/2
            stack: true
          - part: demo and pages 1 of 2
            id: demo-1
            projects: --project=demo --project=pages
            shard: 1/2
            stack: false
          - part: demo and pages 2 of 2
            id: demo-2
            projects: --project=demo --project=pages
            shard: 2/2
            stack: false
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fnb/web exec playwright install --with-deps chromium
      - if: matrix.stack
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - if: matrix.stack
        run: pnpm exec supabase db reset
      - name: Point the web app at the local stack
        if: matrix.stack
        run: |
          eval "$(pnpm exec supabase status -o env)"
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > apps/web/.env.local
      - name: Playwright ${{ matrix.projects }} shard ${{ matrix.shard }}
        run: pnpm --filter @fnb/web exec playwright test ${{ matrix.projects }} --shard=${{ matrix.shard }}
        env:
          DATABASE_URL: ${{ matrix.stack && 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' || '' }}
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.id }}
          path: apps/web/node_modules/.cache/playwright-results-0/
          include-hidden-files: true
          retention-days: 7
      - if: always() && matrix.stack
        run: pnpm exec supabase stop --no-backup

  mini-apps:
    name: Mini App builds, budgets and browser checks
    runs-on: ubuntu-latest
    # 30 since 2026-11-23: the job took 14 to 18 minutes and run 45151976690 was cancelled at the old 20-minute limit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build both Mini Apps for two synthetic brands from configuration, within the budgets
        run: |
          config="$PWD/packages/zalo-mini/config/synthetic-brands.json"
          for app in staff customer; do
            generated="$PWD/apps/zalo-$app/node_modules/.cache/app-config"
            for brand in brand-1 brand-2; do
              pnpm --filter @fnb/zalo-mini app-config --config "$config" --brand "$brand" --app "$app" --out "$generated/$brand.json"
              MINI_APP_CONFIG="$generated/$brand.json" VITE_MINI_APP_STAGE=testing pnpm --filter "@fnb/zalo-$app" exec vite build --outDir "dist/$brand" --emptyOutDir
            done
            pnpm --filter @fnb/zalo-mini app-config --compare "$generated/brand-1.json" "$generated/brand-2.json"
            node packages/zalo-mini/scripts/check-budget.mjs --app "apps/zalo-$app" --dist dist/brand-1 --dist dist/brand-2
          done
      - name: A Development build carries the probe screen that the Testing builds above refuse
        run: |
          VITE_MINI_APP_STAGE=development pnpm --filter @fnb/zalo-customer exec vite build --outDir dist/development --emptyOutDir
          grep -rq phone-probe apps/zalo-customer/dist/development
      # Both Mini Apps also run on WebKit (the iPhone engine), so install it next to Chromium.
      - run: pnpm --filter @fnb/zalo-staff exec playwright install --with-deps chromium webkit
      - name: Staff Mini App in the browser with the mocked SDK (360 px, light and dark, paint budget)
        run: pnpm --filter @fnb/zalo-staff test:e2e
      - name: Customer Mini App in the browser with the mocked SDK (360 px, light and dark, paint budget)
        run: pnpm --filter @fnb/zalo-customer test:e2e
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mini-app-playwright-results
          path: |
            apps/zalo-staff/node_modules/.cache/playwright-results-0/
            apps/zalo-customer/node_modules/.cache/playwright-results-0/
          include-hidden-files: true
          retention-days: 7

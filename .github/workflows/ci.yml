name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret and identifier scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --exit-code 1
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/check-public-safe.mjs

  code:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the Edge Function import map is current
        run: node scripts/function-imports.mjs --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.3
      - name: Type-check the sync-incremental Edge Function with Deno
        working-directory: supabase/functions/sync-incremental
        run: deno check index.ts

  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta
      - run: pnpm exec supabase db reset
      - run: pnpm exec supabase test db
      - name: The OpenAPI description matches the database
        run: pnpm docs:check-openapi
      - run: pnpm --filter @fnb/demo-analytics test:parity:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    name: Web end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fnb/web exec playwright install --with-deps chromium
      - run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta
      - run: pnpm exec supabase db reset
      - name: Point the web app at the local stack
        run: |
          eval "$(pnpm exec supabase status -o env)"
          test -n "$API_URL" && test -n "$PUBLISHABLE_KEY"
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$API_URL" "$PUBLISHABLE_KEY" > apps/web/.env.local
      - run: pnpm --filter @fnb/web test:e2e
      - if: always()
        run: pnpm exec supabase stop --no-backup

title = "FNB Manager gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic fixtures used by unit tests"
paths = [
	'''packages/[^/]+/test/fixtures/.*''',
]

[[allowlists]]
description = "Obviously synthetic hex tokens"
regexes = [
	'''0123456789abcdef0123456789abcdef''',
	'''f{32}''',
]

[[allowlists]]
description = "The synthetic JWT {\"alg\":\"HS256\"}.{\"sub\":\"1\"}.signature that zalo-config tests offer as a refused secret name"
regexes = [
	'''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxIn0\.c2lnbmF0dXJl$''',
]

[[allowlists]]
description = "The synthetic counter QR tokens of the customer Mini App demo world"
targetRules = ["generic-api-key"]
paths = [
	'''apps/zalo-customer/src/demo/fixtures\.ts''',
	'''apps/zalo-staff/src/loyalty/bills-demo\.ts''',
]

[[allowlists]]
description = "The synthetic publishable key of the Zalo relay's command-line tests (ADR-057)"
targetRules = ["generic-api-key"]
regexes = [
	'''sb_publishable_syntheticKey123''',
]
